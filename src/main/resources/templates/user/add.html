<div class="modal-content" th:fragment="addModal" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-header text-black bg-light">
        <h5 class="modal-title" th:text="${addModalTitle}">Title</h5>
    </div>
    <div class="modal-body">
        <form id="add-form" class="needs-validation" novalidate>
            <div class="container">
                <div class="row g-1">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="floatingType" aria-label="floatingType" name="role" required>
                                <option value=""></option>
                                <option value="CUSTOMER">Client</option>
                                <option value="STAFF">Employé</option>
                            </select>
                            <label for="floatingType">Type d'utilisateur <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un type.</div>
                        </div>
                    </div>

                    <div class="col-md-6 d-none" id="customerContainer">
                        <div class="form-floating">
                            <select class="form-select" id="floatingCustomer" aria-label="floatingCustomer" name="customerId">
                                <option value=""></option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                            <label for="floatingCustomer">Client <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un client.</div>
                        </div>
                    </div>

                    <div class="col-md-6 d-none" id="staffContainer">
                        <div class="form-floating">
                            <select class="form-select" id="floatingStaff" aria-label="floatingStaff" name="staffId">
                                <option value=""></option>
                                <option th:each="s : ${staffs}"
                                        th:value="${s.id}"
                                        th:text="${s.name}">
                                </option>
                            </select>
                            <label for="floatingStaff">Personnel <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un personnel.</div>
                        </div>
                    </div>

                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer bg-light">
        <button class="btn btn-danger" data-bs-dismiss="modal" id="cancelBtn" type="reset">Annuler</button>
        <button class="btn btn-primary" type="button" id="submitBtn">Enregistrer</button>
    </div>
</div>

<script>
    $(document).on('change', '#add-form #floatingType', function () {
        const selectedType = $(this).val();
        console.log('Type sélectionné :', selectedType);

        const $modal = $(this).closest('#add');
        const $customerContainer = $modal.find('#customerContainer');
        const $staffContainer = $modal.find('#staffContainer');
        const $customerSelect = $modal.find('#floatingCustomer');
        const $staffSelect = $modal.find('#floatingStaff');

        // Réinitialisation propre sans déclencher d'événements parasites
        $customerSelect.val('').prop('required', false);
        $staffSelect.val('').prop('required', false);
        $customerContainer.addClass('d-none');
        $staffContainer.addClass('d-none');

        if (!selectedType) {
            return;
        }

        if (selectedType === "STAFF") {
            $staffContainer.removeClass('d-none');
            $staffSelect.prop('required', true);
        } else {
            $customerContainer.removeClass('d-none');
            $customerSelect.prop('required', true);
        }
    });

    $(document).on('click', '#add #submitBtn', function(e) {
        e.preventDefault();

        const form = document.getElementById('add-form');
        if (!form) {
            console.error('Form add-form not found in the DOM.');
            return;
        }

        const $addForm = $(form);
        $addForm.addClass('was-validated');

        if (!form.checkValidity()) {
            alerts('Veuillez remplir tous les champs de saisie ayant des (<b class="text-danger">*</b>)');
            return;
        }

        const staffVal = $addForm.find('select[name="staffId"]').val()?.trim();
        const customerVal = $addForm.find('select[name="customerId"]').val()?.trim();

        const request = {
            staffId: staffVal || null,
            customerId: customerVal || null
        };

        $.ajax({
            url: '/api/users/create',
            type: 'POST',
            contentType: 'application/json',
            headers: token && header ? { [header]: token } : {},
            data: JSON.stringify(request),
            beforeSend: function() {
                $('#add #cancelBtn').prop('disabled', true);
                $('#add #submitBtn').prop('disabled', true).html(`
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Enregistrement...
            `);
            },
            success: function(response) {
                alerts("L'utilisateur a été créé avec succès !", 'alert-success', 'bi-check-circle', 1200);
                setTimeout(function() {
                    location.reload();
                }, 1200);
            },
            error: function(xhr, status, error) {
                const serverMessage = xhr.responseJSON?.message || "Une erreur est survenue lors de l'enregistrement.";
                alerts(serverMessage);
                console.error("Erreur lors de l'enregistrement :", xhr.responseText || error);
                $('#add #cancelBtn').prop('disabled', false);
                $('#add #submitBtn').prop('disabled', false).text('Enregistrer');
            }
        });
    });

    // 3. Réinitialisation complète à la fermeture de la modale #add
    $(document).on('hidden.bs.modal', '#add', function () {
        const form = document.getElementById('add-form');
        if (form) {
            $(form).removeClass('was-validated');
            form.reset();
        }
        // Re-masquer les deux champs conditionnels à la fermeture
        $('#add #customerContainer, #add #staffContainer').addClass('d-none');
        $('#add #floatingCustomer, #add #floatingStaff').val('').prop('required', false);

        $('#add #cancelBtn').prop('disabled', false);
        $('#add #submitBtn').prop('disabled', false).text('Enregistrer');
    });
</script>
