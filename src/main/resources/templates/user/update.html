<div class="modal-content" th:fragment="updateModal" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-header text-black bg-light">
        <h5 class="modal-title" th:text="${updateModalTitle}">Title</h5>
    </div>
    <div class="modal-body">
        <form id="upd-form" class="needs-validation" novalidate>
            <div class="container">
                <div class="row g-1">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="floatingType" aria-label="floatingType" name="type" required>
                                <option value=""></option>
                                <option value="CUSTOMER">Client</option>
                                <option value="STAFF">Employé</option>
                            </select>
                            <label for="floatingType">Type d'utilisateur <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un type.</div>
                        </div>
                    </div>

                    <div class="col-md-6 d-none" id="customerContainer">
                        <div class="form-floating">
                            <select class="form-select" id="floatingCustomer" aria-label="floatingCustomer" name="customerId">
                                <option value=""></option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                            <label for="floatingCustomer">Client <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un client.</div>
                        </div>
                    </div>

                    <div class="col-md-6 d-none" id="staffContainer">
                        <div class="form-floating">
                            <select class="form-select" id="floatingStaff" aria-label="floatingStaff" name="staffId">
                                <option value=""></option>
                                <option th:each="s : ${staffs}"
                                        th:value="${s.id}"
                                        th:text="${s.name}">
                                </option>
                            </select>
                            <label for="floatingStaff">Personnel <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner un personnel.</div>
                        </div>
                    </div>

                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer bg-light">
        <button class="btn btn-danger" data-bs-dismiss="modal" id="cancelBtn" type="reset">Annuler</button>
        <button class="btn btn-warning" type="button" id="submitBtn">Modifier</button>
    </div>
</div>

<script>
    const $udpForm = $('#upd-form');
    let staffId;

    $(document).on('change', '#upd-form #floatingType', function () {
        const selectedType = ($(this).val() || '').trim().toUpperCase();

        const $customerContainer = $('#add #customerContainer');
        const $staffContainer = $('#add #staffContainer');
        const $customerSelect = $('#add #floatingCustomer');
        const $staffSelect = $('#add #floatingStaff');

        // Toujours réinitialiser les deux selects et retirer l'obligation avant d'appliquer le nouveau choix
        $customerSelect.val('').prop('required', false).trigger('change');
        $staffSelect.val('').prop('required', false).trigger('change');
        $customerContainer.addClass('d-none');
        $staffContainer.addClass('d-none');

        // Adapter 'STAFF' et 'CUSTOMER' selon les valeurs exactes de votre enum ${userTypes}
        if (selectedType === 'STAFF') {
            $staffContainer.removeClass('d-none');
            $staffSelect.prop('required', true);
        } else if (selectedType === 'CUSTOMER') {
            $customerContainer.removeClass('d-none');
            $customerSelect.prop('required', true);
        }
    });

    $(document).on('click', '.openUpdModal', function() {
        staffId = $(this).attr('data-id');
        const data = itemData.find(item => item.id === parseInt(staffId, 10));

        if (!data) {
            alerts("Impossible de charger les données de cette agence.");
            return;
        }

        $udpForm.find('input[name="name"]').val(data.name);
        $udpForm.find('input[name="surname"]').val(data.surname);
        $udpForm.find('select[name="agencyId"]').val(data.agency.id).prop('selected', true);
        $udpForm.find('select[name="role"]').val(data.role).prop('selected', true);
    });

    // 2. Soumission du formulaire
    $(document).on('click', '#upd #submitBtn', function(e) {
        e.preventDefault();

        $udpForm.addClass('was-validated');
        const form = $udpForm[0]; // Récupère l'élément DOM natif

        if (!form.checkValidity()) {
            alerts('Veuillez remplir tous les champs de saisie ayant des (<b class="text-danger">*</b>)');
            return;
        }

        const request = {
            name: $udpForm.find('input[name="name"]').val().trim(),
            surname: $udpForm.find('input[name="surname"]').val().trim(),
            role: $udpForm.find('select[name="role"]').val().trim(),
            agencyId: $udpForm.find('select[name="agencyId"]').val().trim()
        };

        $.ajax({
            url: `/api/staffs/${staffId}/update`,
            type: 'PUT',
            contentType: 'application/json', // Plus propre que dans headers
            headers: token && header ? { [header]: token } : {},
            data: JSON.stringify(request),
            beforeSend: function() {
                $('#upd #cancelBtn').prop('disabled', true);
                $('#upd #submitBtn').prop('disabled', true).html(`
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Mise à jour...
            `);
            },
            success: function(response) {
                alerts("L'agence a été mise à jour avec succès !", 'alert-success', 'bi-check-circle', 1200);
                setTimeout(function() {
                    location.reload();
                }, 1200);
            },
            error: function(xhr, status, error) {
                // Récupérer le message d'erreur du backend (Spring Boot / API) s'il existe
                const serverMessage = xhr.responseJSON?.message || "Une erreur est survenue lors de la mise à jour.";
                alerts(serverMessage);
                console.error("Erreur lors de la mise à jour :", xhr.responseText || error);
                $('#upd #cancelBtn').prop('disabled', false);
                $('#upd #submitBtn').prop('disabled', false).text('Modifier');
            }
        });
    });

    // 3. Réinitialisation à la fermeture de la modale
    $('#upd').on('hidden.bs.modal', function () {
        $udpForm.removeClass('was-validated');
        $udpForm[0].reset(); // Correction du bug .reset()
        $('#upd #cancelBtn').prop('disabled', false);
        $('#upd #submitBtn').prop('disabled', false).text('Modifier');
    });
</script>
