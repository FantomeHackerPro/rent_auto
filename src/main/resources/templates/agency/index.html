<section class="section" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${listTitle}">Liste</h5>
                    <p align="right">
                        <button type="button" sec:authorize="hasRole('ADMIN')" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add"><i class="bi bi-plus-circle-fill me-1"></i> Ajouter</button>
                    </p>

                    <!-- Table with stripped rows -->
                    <div>
                        <table class="table table-striped " id="items">
                            <thead>
                                <tr>
                                    <th>Nom</th>
                                    <th>Adresse</th>
                                    <th>Ville</th>
                                    <th>Adresse email</th>
                                    <th>N° Téléphone</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" data-bs-backdrop="static" id="add" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${addModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="upd" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${updateModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="vehicle" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
                <div th:replace="~{${vehicleModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="staff" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
                <div th:replace="~{${staffModal}}"></div>
            </div>
        </div>
    </div>

        let itemData = /*[[${data}]]*/ [];
        console.log(itemData);

        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

            $("#items").DataTable({
                data: itemData,
                destroy: true,
                columns: [
                    {data: 'name'},
                    {data: 'address'},
                    {data: 'city'},
                    {data: 'email'},
                    {data: 'phone'},
                    // {

                    //         let year = row.year ? row.year : "";
                    //         let month = row.month ? row.month : "";
                    //         let intellectual = row.intellectualPerformance ? row.intellectualPerformance : "";

                    //         return `
                    //             <span class="small"><b>Mois</b> : ${month}</span><br>

                            let item1 = '<i class="bi bi-pencil-fill text-warning pr-5 pl-5 openUpdModal" sec:authorize="hasRole(\'ADMIN\')" title="modifier" data-bs-toggle="modal" data-bs-target="#upd" data-id="'+row.id+'" id="open-update-modal" style="cursor: pointer; margin: 0 5px"></i>';
                            let item3 = '<i class="bi bi-people-fill text-primary pl-5 openStaffModal" sec:authorize="hasAnyRole(\'ADMIN\', \'MANAGER\')" title="personnels" data-bs-toggle="modal" data-bs-target="#staff" data-id="'+row.id+'" style="cursor: pointer; margin: 0 5px"></i>';
                            let item4 = '<i class="bi bi-truck text-primary pl-5 openVehicleModal" sec:authorize="hasAnyRole(\'ADMIN\', \'MANAGER\')" title="véhicules" data-bs-toggle="modal" data-bs-target="#vehicle" data-id="'+row.id+'" style="cursor: pointer; margin: 0 5px"></i>';

</section>
