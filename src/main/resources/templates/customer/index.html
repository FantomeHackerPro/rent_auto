<section class="section" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${listTitle}">Liste</h5>
                    <p align="right">
                        <button type="button" class="btn btn-primary" sec:authorize="hasAnyRole('MANAGER', 'AGENT')" data-bs-toggle="modal" data-bs-target="#add"><i class="bi bi-plus-circle-fill me-1"></i> Ajouter</button>
                    </p>

                    <!-- Table with stripped rows -->
                    <div>
                        <table class="table table-striped " id="items">
                            <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Adresse email</th>
                                <th>N° Téléphone</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" data-bs-backdrop="static" id="add" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${addModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="upd" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${updateModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="booking" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
                <div th:replace="~{${bookingModal}}"></div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let itemData = /*[[${data}]]*/ [];
        console.log(itemData);

        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        $(document).ready(function() {
            $("#items").DataTable({
                data: itemData,
                destroy: true,
                columns: [
                    {data: 'name'},
                    {data: 'email'},
                    {data: 'phone'},
                    {
                        data: null,
                        render: function(data, type, row) {
                            let item1 = '<i class="bi bi-pencil-fill text-warning pr-5 pl-5 openUpdModal" sec:authorize="hasAnyRole(\'MANAGER\', \'AGENT\', \'CUSTOMER\')" title="modifier" data-bs-toggle="modal" data-bs-target="#upd" data-id="'+row.id+'" id="open-update-modal" style="cursor: pointer; margin: 0 5px"></i>';
                            let item3 = '<i class="bi bi-card-checklist text-primary pl-5 openBookingModal" sec:authorize="hasAnyRole(\'MANAGER\', \'AGENT\', \'CUSTOMER\')" title="réservations" data-bs-toggle="modal" data-bs-target="#booking" data-id="'+row.id+'" style="cursor: pointer; margin: 0 5px"></i>';

                            return item1 + ' ' + item3;
                        }
                    },
                ]
            });
        });
    </script>
</section>
