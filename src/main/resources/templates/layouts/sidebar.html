<aside xmlns:th="http://www.thymleaft.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" id="sidebar" class="sidebar" th:fragment="aside">
    <ul class="sidebar-nav" id="sidebar-nav">
        <!-- Affiché uniquement si l'utilisateur connecté a le rôle CUSTOMER -->
        <li class="nav-item" th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
            <a class="nav-link collapsed" th:href="@{/home}">
                <i class="bi bi-house-door"></i>
                <span>Accueil</span>
            </a>
        </li><!-- End Home Nav -->

        <!-- Affiché uniquement si l'utilisateur est connecté avec un autre rôle que CUSTOMER -->
        <li class="nav-item" th:if="${#authorization.expression('isAuthenticated() and !hasRole(''CUSTOMER'')')}">
            <a class="nav-link collapsed" th:href="@{/dashboard}">
                <i class="bi bi-grid"></i>
                <span>Tableau de bord</span>
            </a>
        </li><!-- End Dashboard Nav -->

        <li class="nav-heading"><hr></li>

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link collapsed" th:href="@{/agency}">
                <i class="bi bi-geo-alt"></i><span>Agences</span>
            </a>
        </li><!-- End Agency Nav -->

        <li class="nav-item" sec:authorize="hasAnyRole('AGENT','MANAGER')">
            <a class="nav-link collapsed" th:href="@{/customer}">
                <i class="bi bi-people"></i><span>Clients</span>
            </a>
        </li><!-- End Customer Nav -->

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link collapsed" th:href="@{/equipment}">
                <i class="bi bi-tools"></i><span>Equipements</span>
            </a>
        </li><!-- End Equipment Nav -->

        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'AGENT', 'MANAGER')">
            <a class="nav-link collapsed" th:href="@{/staff}">
                <i class="bi bi-people"></i><span>Personnels</span>
            </a>
        </li><!-- End AGENT Nav -->

        <li class="nav-item" sec:authorize="hasAnyRole('CUSTOMER','AGENT','MANAGER')">
            <a class="nav-link collapsed" th:href="@{/booking}">
                <i class="bi bi-card-checklist"></i><span>Réservations</span>
            </a>
        </li><!-- End Booking Nav -->

        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link collapsed" th:href="@{/user}">
                <i class="bi bi-people"></i><span>Utilisateurs</span>
            </a>
        </li><!-- End User Nav -->

        <li class="nav-item" sec:authorize="hasAnyRole('AGENT','MANAGER')">
            <a class="nav-link collapsed" th:href="@{/vehicle}">
                <i class="bi bi-truck"></i><span>Vehicules</span>
            </a>
        </li><!-- End Vehicle Nav -->
    </ul>
</aside>
