<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>

    <title th:text="${pageTitle}">Dashboard</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link th:href="@{/assets/img/favicon.png}" rel="icon">
    <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/remixicon/remixicon.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/datatables/datatables.min.css}" rel="stylesheet">

    <!-- Select2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <!-- Template Main CSS File -->
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">

    <!-- jQuery -->
    <script th:src="@{/assets/js/jquery.min.js}"></script>
</head>

<body>

<!-- ======= Header ======= -->
<header th:replace="~{layouts/header :: header}"></header>
<!-- End Header -->

<!-- ======= Sidebar ======= -->
<aside th:replace="~{layouts/sidebar :: aside}"></aside>
<!-- End Sidebar-->

<!-- ======= Main ======= -->
<main class="main" id="main">
    <div class="pagetitle mb-3">
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item" id="dashboard"><a th:href="@{/dashboard}">Tableau de bord</a></li>
                <li class="breadcrumb-item active" id="sectionGroupTitle" th:text="${sectionGroupTitle}"></li>
                <li class="breadcrumb-item active" id="sectionTitle" th:text="${sectionTitle}"></li>
            </ol>
        </nav>
    </div>
    <!-- End Page Title -->
    <section th:replace="~{__${content}__}"></section>
</main>
<!-- End #main -->

<!-- ======= Footer ======= -->
<footer th:replace="~{layouts/footer :: footer}"></footer>
<!-- End Footer -->

<a class="back-to-top d-flex align-items-center justify-content-center" href="#"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Vendor JS Files -->
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/vendor/datatables/datatables.min.js}"></script>
<!-- Décommentez si vos pages utilisent ces librairies : -->
<!-- <script th:src="@{/assets/vendor/apexcharts/apexcharts.min.js}"></script> -->
<!-- <script th:src="@{/assets/vendor/echarts/echarts.min.js}"></script> -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- Template Main JS File -->
<script th:src="@{/assets/js/main.js}"></script>

<script th:inline="javascript">
    let section = /*[[${sectionTitle}]]*/ "";
    if (section === "") $("#sectionTitle").addClass("d-none");

    let sectionGroup = /*[[${sectionGroupTitle}]]*/ "";
    if (sectionGroup === "") $("#sectionGroupTitle").addClass("d-none");
</script>

</body>
</html>
