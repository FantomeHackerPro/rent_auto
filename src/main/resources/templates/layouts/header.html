<header xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        id="header"
        class="header fixed-top d-flex align-items-center"
        th:fragment="header">
    <div class="d-flex align-items-center justify-content-between">
        <a th:href="@{/}" class="logo d-flex align-items-center">
            <img th:src="@{/assets/img/logo.png}" alt="">
            <span class="d-none d-lg-block">Rent Auto</span>
        </a>
        <i class="bi bi-list toggle-sidebar-btn" sec:authorize="isAuthenticated()"></i>
    </div><!-- End Logo -->

    <nav class="header-nav ms-auto">
        <ul class="d-flex align-items-center pe-3">
            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}">
                    <i class="bi bi-person"></i>
                    <span>Login</span>
                </a>
            </li>

            <li class="nav-item dropdown pe-3" sec:authorize="isAuthenticated()">
                <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
                    <img th:src="@{/assets/img/user-logo.webp}" width="50" height="30" alt="Profile" class="rounded-circle">
                    <span class="d-none d-md-block dropdown-toggle ps-2"
                          th:text="${currentUser != null ? currentUser.username : (#authentication != null ? #authentication.name : 'Invité')}">
                        J. Doe
                    </span>
                </a><!-- End Profile Image Icon -->

                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
                    <li class="dropdown-header">
                        <h6 th:text="${#authentication.name}">John Doe</h6>
                        <span th:if="${!#lists.isEmpty(#authentication.authorities)}"
                              th:text="${#strings.replace(#authentication.authorities[0].authority, 'ROLE_', '')}">
                            Rôle
                        </span>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item d-flex align-items-center border-0 bg-transparent w-100">
                                <i class="bi bi-box-arrow-right"></i>
                                <span>Sign Out</span>
                            </button>
                        </form>
                    </li>
                </ul><!-- End Profile Dropdown Items -->
            </li><!-- End Profile Nav -->
        </ul>
    </nav><!-- End Icons Navigation -->
</header>
