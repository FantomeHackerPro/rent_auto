<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>

    <title th:text="${pageTitle}">Accueil - Rent Auto</title>

    <!-- Favicons -->
    <link th:href="@{/assets/img/favicon.png}" rel="icon">
    <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/boxicons/css/boxicons.min.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/remixicon/remixicon.css}" rel="stylesheet">
    <link th:href="@{/assets/vendor/datatables/datatables.min.css}" rel="stylesheet">
    <script th:src="@{/assets/js/jquery.min.js}"></script>

    <!-- Template Main CSS File -->
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">

    <!-- Vendor JS Files -->
    <script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables/datatables.min.js}"></script>

    <!-- Template Main JS File -->
    <script defer th:src="@{/assets/js/main.js}"></script>
</head>

<body th:classappend="${#authorization.expression('!isAuthenticated()')} ? 'toggle-sidebar' : ''">

<!-- ======= Header ======= -->
<header th:replace="~{layouts/header :: header}"></header>
<!-- End Header -->

<aside th:replace="~{layouts/sidebar :: aside}"></aside>

<!-- ======= Main ======= -->
<main class="main" id="main">
    <div class="pagetitle mb-3">
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Tableau de bord</a></li>
                <li class="breadcrumb-item active" id="sectionGroupTitle" th:text="${sectionGroupTitle}"></li>
                <li class="breadcrumb-item active" id="sectionTitle" th:text="${sectionTitle}"></li>
            </ol>
        </nav>
    </div>
    <!-- End Page Title -->

    <section>
        <!-- Message si aucun véhicule n'est disponible -->
        <div class="alert alert-info rounded-3" th:if="${vehicles == null or #lists.isEmpty(vehicles)}">
            <i class="bi bi-info-circle me-2"></i> Aucun véhicule n'est disponible pour le moment.
        </div>

        <!-- Grille alignée des véhicules -->
        <div class="row g-3" th:if="${vehicles != null and !#lists.isEmpty(vehicles)}">
            <div th:each="vehicle : ${vehicles}"
                 th:if="${vehicle != null}"
                 th:class="${#lists.size(vehicles) == 1} ? 'col-12' : 'col-12 col-md-6 col-lg-4'">
                <div class="card col-md-3">
                    <div class="position-relative">
                        <img th:src="${(vehicle?.imageUrl != null and !#strings.isEmpty(vehicle?.imageUrl)) ? vehicle.imageUrl : '/assets/img/logo.png'}"
                             class="card-img-top"
                             height="200"
                             th:alt="${(vehicle?.brand ?: '') + ' ' + (vehicle?.model ?: '')}"
                             onerror="this.onerror=null;this.src='/assets/img/logo.png';">
                        <span class="badge rounded-pill bg-primary position-absolute top-0 end-0 m-2 px-2 py-1 small"
                              th:text="${vehicle?.category}">
                        SUV
                    </span>
                    </div>

                    <div class="card-body">
                        <h6 class="card-title mb-1 p-0 fw-bold fs-6 text-truncate"
                            th:text="${(vehicle?.brand ?: '') + ' ' + (vehicle?.model ?: '')}">
                            Brand Model
                        </h6>
                        <small class="text-muted mb-2" th:text="'Année : ' + ${vehicle?.year}">Année : 2024</small>

                        <!-- Équipements associés -->
                        <div class="mb-3">
                            <small class="text-muted d-block mb-1 fw-semibold">Équipements :</small>
                            <div class="d-flex flex-wrap gap-1" th:if="${vehicle?.equipments != null and !#lists.isEmpty(vehicle?.equipments)}">
                            <span class="badge rounded-pill bg-light text-dark border px-2 py-1"
                                  th:each="eq : ${vehicle.equipments}"
                                  th:text="${eq?.label}">
                                GPS
                            </span>
                            </div>
                            <small class="text-muted fst-italic" th:if="${vehicle?.equipments == null or #lists.isEmpty(vehicle?.equipments)}">
                                Équipement standard
                            </small>
                        </div>

                        <!-- Tarif journalier et action alignés en bas -->
                        <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                            <div>
                            <span class="fs-6 fw-bold text-primary"
                                  th:text="${(vehicle?.dailyRate ?: 0) + ' €'}">55 €</span>
                                <small class="text-muted">/ j</small>
                            </div>

                            <button class="btn btn-sm btn-primary rounded-pill px-3"
                                    data-bs-toggle="modal" data-bs-target="#add"
                                    type="button"
                                    th:attr="data-id=${vehicle?.id}">
                                <i class="bi bi-calendar-check me-1"></i> Réserver
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<!-- End #main -->

<!-- ======= Booking Modal (3 Steps) ======= -->
<div class="modal fade" data-bs-backdrop="static" id="add" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
        <div th:replace="~{${addModal}}"></div>
    </div>
</div>

<!-- ======= Footer ======= -->
<footer th:replace="~{layouts/footer :: footer}"></footer>
<!-- End Footer -->

<a class="back-to-top d-flex align-items-center justify-content-center" href="#">
    <i class="bi bi-arrow-up-short"></i>
</a>

<script th:inline="javascript">
    const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
    let customerId;

    let section = /*[[${sectionTitle}]]*/ "";
    if (!section) $("#sectionTitle").addClass("d-none");

    let sectionGroup = /*[[${sectionGroupTitle}]]*/ "";
    if (!sectionGroup) $("#sectionGroupTitle").addClass("d-none");

    const csrfToken = $('meta[name="_csrf"]').attr('content');
    const csrfHeader = $('meta[name="_csrf_header"]').attr('content');

    const $addForm = $("#add #add-form");

    $('#add').on('show.bs.modal', function (event) {
        const button = $(event.relatedTarget);
        vehicleId = button.data('id');

        const form = document.getElementById('add-form');
        form.reset();
        $('.form-step').removeClass('was-validated');
        currentStep = 1;

        updateStepUI();
    });

    $(document).on('click', '#add #submitBtn', function (e) {
        e.preventDefault();

        if (!validateCurrentStep()) {
            return;
        }

        addCustomer();
    });

    function getAddForm() {
        const $form = $('#add #add-form');
        if (!$form.length) {
            console.error('Formulaire #add-form introuvable dans #add');
            return null;
        }
        return $form;
    }

    function getTrimmedField($form, selector) {
        const val = $form.find(selector).val();
        return typeof val === 'string' ? val.trim() : '';
    }

    function addCustomer() {
        const $form = getAddForm();
        if (!$form) return;

        const requestCustomer = {
            name: getTrimmedField($form, '[name="name"]'),
            email: getTrimmedField($form, '[name="email"]'),
            phone: getTrimmedField($form, '[name="phone"]'),
            hasAccount: true,
        };

        $.ajax({
            url: '/api/customers/create',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestCustomer),
            headers: csrfToken && csrfHeader ? { [csrfHeader]: csrfToken } : {},
            beforeSend: function () {
                $('#prevStepBtn, #cancelBtn, #cancelBookingBtn, #submitBtn').prop('disabled', true);
                $('#submitBtn').html(`
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Traitement...
            `);
            },
            success: function (response) {
                if (response.status === 201) {
                    customerId = response.data[0].id;
                    addBooking();
                }
            },
            error: function (xhr, status, error) {
                console.error("Erreur création client :", xhr.responseText || error);
                $('#prevStepBtn, #cancelBtn, #cancelBookingBtn, #submitBtn').prop('disabled', false);
                $('#submitBtn').html('<i class="bi bi-check-circle me-1"></i> Confirmer la réservation');
            }
        });
    }

    function addPayment() {
        const $form = getAddForm();
        if (!$form) return;

        const requestPayment = {
            amount: $addForm.find('input[name="amount"]').val().trim(),
            paymentDate: $addForm.find('input[name="paymentDate"]').val().trim(),
            paymentMode: $addForm.find('select[name="paymentMode"]').val().trim(),
            contractId: contractId,
        };

        $.ajax({
            url: '/api/payments/create',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestPayment),
            headers: csrfToken && csrfHeader ? { [csrfHeader]: csrfToken } : {},
            beforeSend: function () {
                $('#prevStepBtn, #cancelBookingBtn, #submitBtn').prop('disabled', true);
                $('#submitBtn').html(`
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Traitement...
                `);
            },
            success: function (response) {
                if (response.status === 201) {
                    if (typeof alerts === 'function') {
                        alerts("La réservation a été créée avec succès !", 'alert-success', 'bi-check-circle', 1500);
                    }
                    setTimeout(function() {
                        location.reload();
                    }, 1500);
                }
            },
            error: function (xhr, status, error) {
                console.error("Erreur paiement :", xhr.responseText || error);
                $('#prevStepBtn, #cancelBookingBtn, #submitBtn').prop('disabled', false);
                $('#submitBtn').html('<i class="bi bi-check-circle me-1"></i> Confirmer la réservation');
            }
        });
    }

    function addBooking() {
        const $form = getAddForm();
        if (!$form) return;

        const requestBooking = {
            startDate: $addForm.find('input[name="startDate"]').val(),
            endDate: $addForm.find('input[name="endDate"]').val(),
            customerId: customerId,
            vehicleId: vehicleId,
        };

        $.ajax({
            url: '/api/bookings/create',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestBooking),
            headers: csrfToken && csrfHeader ? { [csrfHeader]: csrfToken } : {},
            beforeSend: function () {
                $('#prevStepBtn, #cancelBookingBtn, #submitBtn').prop('disabled', true);
                $('#submitBtn').html(`
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Traitement...
                `);
            },
            success: function (response) {
                if (response.status === 201) {
                    contractId = response.data[0].id;
                    addPayment();
                }
            },
            error: function (xhr, status, error) {
                console.error("Erreur réservation :", xhr.responseText || error);
                $('#prevStepBtn, #cancelBookingBtn, #submitBtn').prop('disabled', false);
                $('#submitBtn').html('<i class="bi bi-check-circle me-1"></i> Confirmer la réservation');
            }
        });
    }
</script>
</body>
</html>
