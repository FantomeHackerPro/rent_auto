<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title th:text="${pageTitle}">Title</title>
    <meta content="" name="description">
    <meta content="" name="keywords">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Favicons -->
    <link href="assets/img/logo.png" rel="icon">
    <link href="assets/img/logo.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

<main>
    <div class="container">

        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

                        <div class="row justify-content-center py-2">
                            <div class="d-flex justify-content-center align-items-center"><img src="/assets/img/logo.png" class="rounded img-fluid" style="max-height: 60px;"></div>
                            <h4 class="d-none d-lg-block fw-bold mt-3" align="center">Rent Auto</h4>
                        </div><!-- End Logo -->

                        <div class="card mb-3">

                            <div class="card-body">

                                <div class="pt-4 pb-2">
                                    <h5 class="card-title text-center pb-0 fs-4 fw-bold">Authentification</h5>
                                </div>

                                <form id="form" class="row g-3 needs-validation" novalidate>

                                    <div class="col-12">
                                        <label for="yourUsername" class="form-label">Login</label>
                                        <div class="input-group has-validation">
                                            <span class="input-group-text" id="inputGroupPrepend">@</span>
                                            <input type="text" name="username" class="form-control" id="yourUsername" required>
                                            <div class="invalid-feedback">Please enter your username.</div>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <label for="yourPassword" class="form-label">Password</label>
                                        <div class="input-group has-validation">
                                            <span class="input-group-text" id="inputGroupPassword"><i class="bi bi-lock-fill"></i></span>
                                            <input type="password" name="password" class="form-control" id="yourPassword" required>
                                            <div class="invalid-feedback">Please enter your password!</div>
                                        </div>
                                    </div>

                                    <div class="col-12 mt-4">
                                        <button class="btn btn-primary w-100" type="button" id="login">Login</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="copyright">
                            &copy; Copyright <strong><span>Rent Auto</span></strong>. All Rights Reserved
                        </div>
                        <div class="credits">
                            Powered by <a href="">Innovate Solution</a>
                        </div>

                    </div>
                </div>
            </div>

        </section>

    </div>
</main><!-- End #main -->

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<!-- Vendor JS Files -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>


<!-- Template Main JS File -->
<script src="assets/js/main.js"></script>

</body>

</html>
<script src="assets/js/jquery.min.js"></script>
<script>
    $('#login').on('click', function(e) {
        e.preventDefault();

        const form = document.getElementById('form');
        const $form = $('#form');

        $form.addClass('was-validated');

        if (!form.checkValidity()) {
            alerts('Veuillez remplir tout les champs de saisie ayant des (<b class="text-danger">*</b>)');
            return;
        }

        let request = {
            "login": $('input[name="login"]').val(),
            "password": $('input[name="password"]').val()
        };

        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        $.ajax({
            url: 'api/auth/login',
            type: 'POST',
            contentType: 'application/json',
            headers: token && header ? { [header]: token } : {},
            data: JSON.stringify(request),
            beforeSend: function() {
                $('#submitBtn').prop('disabled', true).html(`
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Authentification...
                `);
            },
            success: function(response) {
                alerts('Authentification effectuée avec succès !', 'alert-success', 'bi-check-circle');
                setTimeout(function() {
                    location.reload(true);
                }, 4000);
            },
            error: function(xhr, status, error) {
                alerts("Une erreur est survenue lors de l'authentification.");
                console.error("Erreur lors de l'authentification :", xhr.responseText || error);
                $('#submitBtn').prop('disabled', false).html(`
                    Login
                `);
            },
        });
    });
</script>
