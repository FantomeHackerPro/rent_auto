<div class="modal-content" th:fragment="addModal" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-header text-black bg-light">
        <h5 class="modal-title" th:text="${addModalTitle}">Title</h5>
    </div>
    <div class="modal-body">
        <form id="add-form" class="needs-validation" enctype="multipart/form-data" novalidate>
            <div class="container">
                <div class="row g-2">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="addRegistrationNumber" name="registerNumber" placeholder="Immatriculation" type="text" required>
                            <label for="addRegistrationNumber">Immatriculation <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez saisir le numéro d'immatriculation.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="addBrand" name="brand" placeholder="Marque" type="text" required>
                            <label for="addBrand">Marque <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner la marque.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="addModel" name="model" placeholder="Modèle" type="text" required>
                            <label for="addModel">Modèle <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner le modèle.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="addCategory" name="category" required>
                                <option></option>
                                <option th:each="cat : ${vehicleCategories}"
                                        th:value="${cat}"
                                        th:text="${cat}">
                                </option>
                            </select>
                            <label for="addCategory">Catégorie <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner une catégorie.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="addAgency" name="agencyId" required>
                                <option></option>
                                <option th:each="ag : ${agencies}"
                                        th:value="${ag.id}"
                                        th:text="${ag.name}">
                                </option>
                            </select>
                            <label for="addAgency">Agence <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner une Agence.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="addEquipment" name="equipmentIds" multiple="multiple">
                                <option th:each="e : ${equipments}"
                                        th:value="${e.id}"
                                        th:text="${e.label}">
                                </option>
                            </select>
                            <label for="addEquipment">Equipement</label>
                            <div class="invalid-feedback">Veuillez sélectionner un équipement.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="addDailyRate" name="dailyRate" placeholder="Tarif Journalier" type="text" required>
                            <label for="addDailyRate">Tarif Journalier <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner le tarif journalier.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="addYear" name="year" placeholder="Année" type="text" required>
                            <label for="addYear">Année <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner une année.</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="addImage" class="form-label">Photo du véhicule</label>
                        <input class="form-control" id="addImage" name="image" type="file" accept="image/*">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer bg-light">
        <button class="btn btn-danger" data-bs-dismiss="modal" id="cancelBtn" type="reset">Annuler</button>
        <button class="btn btn-primary" type="button" id="submitBtn">Enregistrer</button>
    </div>
</div>

<script>
    $('#add #submitBtn').on('click', function(e) {
        e.preventDefault();

        const form = document.getElementById('add-form');
        const $form = $('#add-form');

        $form.addClass('was-validated');

        if (!form.checkValidity()) {
            alerts('Veuillez remplir tous les champs de saisie ayant des (<b class="text-danger">*</b>)');
            return;
        }

        const formData = new FormData(form);

        $.ajax({
            url: 'api/vehicles/create',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: token && header ? { [header]: token } : {},
            beforeSend: function() {
                $('#add #cancelBtn').prop('disabled', true);
                $('#add #submitBtn').prop('disabled', true).html(`
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Enregistrement...
                `);
            },
            success: function(response) {
                alerts('Véhicule enregistré avec succès !', 'alert-success', 'bi-check-circle');
                setTimeout(function() {
                    location.reload(true);
                }, 4000);
            },
            error: function(xhr, status, error) {
                alerts("Une erreur est survenue lors de l'enregistrement.");
                console.error("Erreur lors de l'enregistrement :", xhr.responseText || error);
                $('#add #cancelBtn').prop('disabled', false);
                $('#add #submitBtn').prop('disabled', false).html('Enregistrer');
            },
        });
    });
</script>
