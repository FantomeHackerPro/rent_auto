<div class="modal-content">
    <div class="modal-header text-black bg-light">
        <h5 class="modal-title" th:text="${maintenanceModalTitle}">Title</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <form id="add-form" class="needs-validation" novalidate>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Nouvelle maintenance</h5>
                    <div class="container">
                        <div class="row g-1">

                            <div class="col-md-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="floatingDescription" name="description" rows="" cols=""></textarea>
                                    <label for="floatingDescription">Description <i class="text-danger">*</i></label>
                                    <div class="invalid-feedback">Veuillez renseigner la description.</div>
                                </div>
                            </div>

                            <div class="col-md-12 mt-3" align="right">
                                <button class="btn btn-danger" data-bs-dismiss="modal" id="cancelBtn" type="reset">Annuler</button>
                                <button class="btn btn-primary" type="button" id="submitBtn">Enregistrer</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </form>

        <div class="card">
            <div class="card-body ">
                <h5 class="card-title" th:text="${maintenanceListTitle}">Liste</h5>

                <div>
                    <table class="table table-striped " id="maintenanceItems">
                        <thead>
                        <tr>
                            <th>Date de début</th>
                            <th>Date de fin</th>
                            <th>Description</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

    $(document).on('click', '.maintenanceModal', function() {
        const data = itemData.find(item => item.id === parseInt($(this).attr('data-id'), 10));

        $("#maintenanceItems").DataTable({
            data: data.maintenances,
            destroy: true,
            columns: [
                {
                    data: null,
                    render: function(data, type, row) {
                        return `<span class="badge bg-warning">${row.startDate}</span>`;
                    }
                },
                {
                    data: null,
                    render: function(data, type, row) {
                        return `<span class="badge bg-primary">${row.endDate}</span>`;
                    }
                },
                {
                    data: null,
                    render: function(data, type, row) {
                        return `<span class="badge bg-secondary">${row.description}</span>`;
                    }
                },
                {
                    data: null,
                    render: function(data, type, row) {
                        let item2 = '<i class="bi bi-trash-fill text-danger pl-5" style="cursor: pointer; margin: 0 5px"></i>';
                        return item2;
                    }
                },

            ]
        });
    });
</script>
