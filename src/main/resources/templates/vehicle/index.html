<section class="section" xmlns:th="http://www.thymeleaf.org">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${listTitle}">Liste</h5>
                    <p align="right">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add"><i class="bi bi-plus-circle-fill me-1"></i> Ajouter</button>
                    </p>

                    <!-- Table with stripped rows -->
                    <div>
                        <table class="table table-striped " id="items">
                            <thead>
                                <tr>
                                    <th>Infos véhicule</th>
                                    <th>Tarif journalier</th>
                                    <th>Année</th>
                                    <th>Statut</th>
                                    <th>Agence</th>
                                    <th>Equipements</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" data-bs-backdrop="static" id="add" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${addModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="upd" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${updateModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="addInMaintenance" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${addInMaintenanceModal}}"></div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let itemData = /*[[${data}]]*/ [];

        $(document).ready(function() {
            $("#items").DataTable({
                data: itemData,
                destroy: true,
                columns: [
                    {
                        data: null,
                        render: function(data, type, row) {
                            let registrationNumber = row.registerNumber ? row.registerNumber : "";
                            let brand = row.brand ? row.brand.toUpperCase() : "";
                            let model = row.model ? row.model.toUpperCase() : "";
                            let year = row.year ? row.year : "";
                            return `
                                <span class="small"><b>Immatriculation</b> : ${registrationNumber}</span><br>
                                <span class="small"><b>Model</b> : ${model}</span><br>
                                <span class="small"><b>Marque</b> : ${brand}</span><br>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-primary">${row.dailyRate} €</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-primary">${row.year}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            let status = row.status ? row.status : "";
                            let bgColor;
                            let label;

                            switch (status) {
                                case "AVAILABLE":
                                    bgColor = "bg-success";
                                    label = "Disponible";
                                    break;
                                case "RENT":
                                    bgColor = "bg-primary";
                                    label = "Loué";
                                    break;
                                case "IN_MAINTENANCE":
                                    bgColor = "bg-warning text-dark";
                                    label = "En Maintenance";
                                    break;
                                default:
                                    bgColor = "bg-secondary";
                                    label = status || "Unknown";
                            }

                            return `
                                <span class="badge ${bgColor}">${label}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-secondary">${row.agency.name}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <div class="accordion" id="accordionEquipment">
                                    <div class="accordion-item">
                                      <h2 class="accordion-header" id="headingOne">
                                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                          Equipements
                                        </button>
                                      </h2>
                                      <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordionEquipment">
                                        <div class="accordion-body">
                                          <ul>
                                            <li></li>
                                          </ul>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            let item1 = '<i class="bi bi-pencil-fill text-warning pr-5 pl-5 openUpdModal" data-bs-toggle="modal" data-bs-target="#upd" data-id="'+row.id+'" id="open-update-modal" style="cursor: pointer; margin: 0 5px"></i>';
                            let item3 = '<i class="bi bi-cone-striped text-primary pr-5 pl-5 addInMaintenance" data-bs-toggle="modal" data-bs-target="#addInMaintenance" data-id="'+row.id+'" id="open-maintenance-modal" style="cursor: pointer; margin: 0 5px"></i>';
                            let item2 = '<i class="bi bi-trash-fill text-danger pl-5" style="cursor: pointer; margin: 0 5px"></i>';
                            let items = item1+' '+item3;

                            return items;
                        }
                    },
                ]
            });
        });
    </script>
</section>
