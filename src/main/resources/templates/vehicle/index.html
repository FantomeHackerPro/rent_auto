<section class="section" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${listTitle}">Liste</h5>
                    <p align="right">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" sec:authorize="hasAnyRole('MANAGER', 'AGENT')" data-bs-target="#add"><i class="bi bi-plus-circle-fill me-1"></i> Ajouter</button>
                    </p>

                    <!-- Table with stripped rows -->
                    <div>
                        <table class="table table-striped " id="items">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Infos véhicule</th>
                                    <th>Tarif journalier</th>
                                    <th>Année</th>
                                    <th>Statut</th>
                                    <th>Agence</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" data-bs-backdrop="static" id="add" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${addModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="upd" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
                <div th:replace="~{${updateModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="maintenance" data-bs-backdrop="static" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
                <div th:replace="~{${maintenanceModal}}"></div>
            </div>
        </div>

        <div class="modal fade" id="equipment" tabindex="-1">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
                <div th:replace="~{${equipmentModal}}"></div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let itemData = /*[[${data}]]*/ [];

        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        $(document).ready(function() {
            $("#items").DataTable({
                data: itemData,
                destroy: true,
                columns: [
                    {
                        data: null,
                        orderable: false,
                        render: function(data, type, row) {
                            const imgSrc = row.imageUrl ? row.imageUrl : '/assets/img/logo.png';
                            const altText = `${row.brand || ''} ${row.model || ''}`.trim() || 'Véhicule';
                            return `
                                <img src="${imgSrc}"
                                     alt="${altText}"
                                     class="rounded border"
                                     style="width: 120px; height: 100px; object-fit: cover;"
                                     onerror="this.onerror=null;this.src='/assets/img/logo.jpg';">
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            let registrationNumber = row.registerNumber ? row.registerNumber : "";
                            let brand = row.brand ? row.brand.toUpperCase() : "";
                            let model = row.model ? row.model.toUpperCase() : "";
                            return `
                                <span class="small"><b>Immatriculation</b> : ${registrationNumber}</span><br>
                                <span class="small"><b>Model</b> : ${model}</span><br>
                                <span class="small"><b>Marque</b> : ${brand}</span><br>
                                <span class="small"><b>Equipements</b> <i class='bi bi-tools text-primary openEquipmentModal' data-bs-toggle='modal' data-bs-target='#equipment' data-id='${row.id}' style='cursor: pointer; margin: 0 5px'></i></span><br>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-primary">${row.dailyRate} €</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-primary">${row.year}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            let status = row.status ? row.status : "";
                            let bgColor;
                            let label;

                            switch (status) {
                                case "AVAILABLE":
                                    bgColor = "bg-success";
                                    label = "Disponible";
                                    break;
                                case "RENT":
                                    bgColor = "bg-primary";
                                    label = "Loué";
                                    break;
                                case "IN_MAINTENANCE":
                                    bgColor = "bg-warning text-dark";
                                    label = "En Maintenance";
                                    break;
                                default:
                                    bgColor = "bg-secondary";
                                    label = status || "Unknown";
                            }

                            return `
                                <span class="badge ${bgColor}">${label}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `
                                <span class="badge bg-secondary">${row.agency.name}</span>
                            `;
                        }
                    },
                    {
                        data: null,
                        render: function(data, type, row) {
                            let item1 = '<i class="bi bi-pencil-fill text-warning pr-5 pl-5 openUpdModal" sec:authorize="hasAnyRole(\'MANAGER\', \'AGENT\')" data-bs-toggle="modal" data-bs-target="#upd" data-id="'+row.id+'" style="cursor: pointer; margin: 0 5px"></i>';
                            let item3 = '<i class="bi bi-cone-striped text-primary pr-5 pl-5 maintenanceModal" sec:authorize="hasAnyRole(\'MANAGER\', \'AGENT\')" data-bs-toggle="modal" data-bs-target="#maintenance" data-id="'+row.id+'" style="cursor: pointer; margin: 0 5px"></i>';
                            return item1 + ' ' + item3;
                        }
                    },
                ]
            });
        });
    </script>
</section>
