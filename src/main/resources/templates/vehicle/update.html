<div class="modal-content" th:fragment="updateModal" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-header text-black bg-light">
        <h5 class="modal-title" th:text="${updateModalTitle}">Title</h5>
    </div>
    <div class="modal-body">
        <form id="upd-form" class="needs-validation" enctype="multipart/form-data" novalidate>
            <div class="container">
                <div class="row g-2">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="updRegistrationNumber" name="registerNumber" placeholder="Immatriculation" type="text" required>
                            <label for="updRegistrationNumber">Immatriculation <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez saisir le numéro d'immatriculation.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="updBrand" name="brand" placeholder="Marque" type="text" required>
                            <label for="updBrand">Marque <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner la marque.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="updModel" name="model" placeholder="Modèle" type="text" required>
                            <label for="updModel">Modèle <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner le modèle.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="updCategory" name="category" required>
                                <option></option>
                                <option th:each="cat : ${vehicleCategories}"
                                        th:value="${cat}"
                                        th:text="${cat}">
                                </option>
                            </select>
                            <label for="updCategory">Catégorie <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner une catégorie.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="updAgency" name="agencyId" required>
                                <option></option>
                                <option th:each="ag : ${agencies}"
                                        th:value="${ag.id}"
                                        th:text="${ag.name}">
                                </option>
                            </select>
                            <label for="updAgency">Agence <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez sélectionner une Agence.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="updEquipment" name="equipmentIds" multiple="multiple">
                                <option th:each="e : ${equipments}"
                                        th:value="${e.id}"
                                        th:text="${e.label}">
                                </option>
                            </select>
                            <label for="updEquipment">Equipement</label>
                            <div class="invalid-feedback">Veuillez sélectionner un équipement.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="updDailyRate" name="dailyRate" placeholder="Tarif Journalier" type="text" required>
                            <label for="updDailyRate">Tarif Journalier <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner le tarif journalier.</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating">
                            <input class="form-control" id="updYear" name="year" placeholder="Année" type="text" required>
                            <label for="updYear">Année <i class="text-danger">*</i></label>
                            <div class="invalid-feedback">Veuillez renseigner une année.</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="updImage" class="form-label">Photo du véhicule (laisser vide pour conserver l'actuelle)</label>
                        <div class="mb-2">
                            <img id="updImagePreview" th:src="@{/assets/img/logo.png}" alt="Aperçu véhicule"
                                 class="img-thumbnail" style="max-height: 120px;">
                        </div>
                        <input class="form-control" id="updImage" name="image" type="file" accept="image/*">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer bg-light">
        <button class="btn btn-danger" data-bs-dismiss="modal" id="cancelBtn" type="reset">Annuler</button>
        <button class="btn btn-primary" type="button" id="submitBtn">Mettre à jour</button>
    </div>
</div>

<script>
    let vehicleId;
    const $udpForm = $("#upd-form");

    $(document).on('click', '.openUpdModal', function() {
        vehicleId = $(this).attr('data-id');
        const data = itemData.find(item => item.id === parseInt(vehicleId, 10));

        if (!data) {
            alerts("Impossible de charger les données de ce véhicule.");
            return;
        }

        $udpForm.find('input[name="registerNumber"]').val(data.registerNumber);
        $udpForm.find('input[name="brand"]').val(data.brand);
        $udpForm.find('input[name="model"]').val(data.model);
        $udpForm.find('input[name="dailyRate"]').val(data.dailyRate);
        $udpForm.find('input[name="year"]').val(data.year);
        $udpForm.find('select[name="category"]').val(data.category).trigger('change');
        $udpForm.find('select[name="agencyId"]').val(data.agency.id).trigger('change');

        const eqIds = data.equipments ? data.equipments.map(e => e.id) : (data.equipmentIds || []);
        $udpForm.find('select[name="equipmentIds"]').val(eqIds).trigger('change');

        $('#updImagePreview').attr('src', data.imageUrl ? data.imageUrl : '/assets/img/logo.png');
        $udpForm.find('input[name="image"]').val('');
    });

    $('#updImage').on('change', function() {
        if (this.files && this.files[0]) {
            $('#updImagePreview').attr('src', URL.createObjectURL(this.files[0]));
        }
    });

    $(document).on('click', '#upd #submitBtn', function(e) {
        e.preventDefault();

        const form = document.getElementById('upd-form');
        const $form = $('#upd-form');

        $form.addClass('was-validated');

        if (!form.checkValidity()) {
            alerts('Veuillez remplir tous les champs de saisie ayant des (<b class="text-danger">*</b>)');
            return;
        }

        const formData = new FormData(form);

        $.ajax({
            url: 'api/vehicles/' + vehicleId + '/update',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: token && header ? { [header]: token } : {},
            beforeSend: function() {
                $('#upd #cancelBtn').prop('disabled', true);
                $('#upd #submitBtn').prop('disabled', true).html(`
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Mise à jour...
                `);
            },
            success: function(response) {
                alerts('Véhicule mis à jour avec succès !', 'alert-success', 'bi-check-circle');
                setTimeout(function() {
                    location.reload(true);
                }, 4000);
            },
            error: function(xhr, status, error) {
                alerts("Une erreur est survenue lors de l'enregistrement.");
                console.error("Erreur lors de l'enregistrement :", xhr.responseText || error);
                $('#upd #cancelBtn').prop('disabled', false);
                $('#upd #submitBtn').prop('disabled', false).html('Mettre à jour');
            },
        });
    });

    $('.modal').on('hidden.bs.modal', function () {
        $(this).find('form').each(function() {
            $(this).removeClass('was-validated');
            this.reset();
        });
    });
</script>
