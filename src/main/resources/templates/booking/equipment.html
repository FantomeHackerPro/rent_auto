<div class="container">

    <div class="row">

        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${equipmentListTitle}">Liste</h5>

                <div>
                    <table class="table table-striped " id="equipmentItems">
                        <thead>
                            <tr>
                                <th>Nom</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

</div>

<script th:inline="javascript">
    $(document).on('click', '.openEquipmentModal', function() {
        const data = itemData.find(item => item.id === parseInt($(this).attr('data-id'), 10));

        $("#equipmentItems").DataTable({
            data: data.vehicle.equipments,
            destroy: true,
            columns: [
                {data: 'label'},
            ]
        });
    });
</script>
