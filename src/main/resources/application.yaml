spring:
  application:
    name: Rent Auto

  springdoc:
    paths-to-match: /api/**
    packages-to-scan: com.innovatesolutions.rentauto

  logging:
    level:
      org.springframework.security: DEBUG

  datasource:
    url: jdbc:mysql://localhost:3306/rent_auto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none  # Options courantes : create, create-drop, update, validate, none
    show-sql: true        # Affiche les requêtes SQL dans la console (utile en développement)
    properties:
      hibernate:
        format_sql: true  # Formate le SQL pour qu'il soit plus lisible dans les logs

server:
  port: 8080              # Port sur lequel votre application va démarrer