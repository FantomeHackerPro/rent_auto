
spring:
  application:
    name: Rent Auto

  datasource:
    url: jdbc:mysql://localhost:3306/rent_auto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  paths-to-match: /api/**
  packages-to-scan: com.innovatesolutions.rentauto

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
